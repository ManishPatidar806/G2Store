version: '3.9'

services:
  db:
    image: mysql:8.1
    container_name: g2store-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-g2store}
      MYSQL_USER: ${MYSQL_USER:-g2store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-g2store}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: g2store-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-g2store}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${MYSQL_USER:-g2store}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-g2store}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: g2store-frontend
    environment:
      VITE_APP_API_URL: ${VITE_APP_API_URL:-http://localhost:8080}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  db_data:
